name: Solla
options:
  bundleIdPrefix: me.adamchol
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SollaCore:
    path: ../SollaCore

targets:
  Solla:
    type: application
    platform: iOS
    sources:
      - Solla
    dependencies:
      - package: SollaCore
        products:
          - MusicTheory
          - Playback
          - ToneSynth
          - SollaEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: me.adamchol.solla
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
